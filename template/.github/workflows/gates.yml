name: gates

# CI 跑的是和本地 pre-commit 完全相同的脚本：scripts/gate.sh
on:
  push:
    branches: ["main", "feat/**", "fix/**", "refactor/**", "test/**", "docs/**", "chore/**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (if Python project)
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'setup.py') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'setup.py') != '' }}
        run: |
          python -m pip install --upgrade pip ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi

      - name: Set up Node (if Node project)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node deps
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Run gate
        run: bash scripts/gate.sh
